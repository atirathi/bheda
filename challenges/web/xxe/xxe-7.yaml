id: xxe-7
title: "XML External Entity - Challenge 7"
category: web
difficulty: hard
cvss: 9.1
owasp: A05:2021 – Security Misconfiguration
endpoint: /api/xxe/7
description: "XXE vulnerability in the SOAP API endpoint. The XML parser has external entity processing enabled."
hints:
  - "Inject an ENTITY declaration that reads a local file."
  - "Use PHP wrappers like php://filter for base64 encoding."
  - "Use out-of-band XXE to exfiltrate data to your server."
flag: "BHEDA{xxe_challenge_7}"
flag_location: "/etc/flag or application source code"
solution_summary: "Inject <!ENTITY xxe SYSTEM 'file:///etc/flag'> and reference &xxe; in an XML element to read the flag file."
