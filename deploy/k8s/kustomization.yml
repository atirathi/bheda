apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: bheda

namePrefix: bheda-
nameSuffix: ~

commonLabels:
  app: bheda
  managed-by: kustomize
  environment: production

resources:
  - backend-deployment.yml
  - frontend-deployment.yml
  - vuln-app-deployment.yml

# Pin to specific tags. Update with each release via CI.
# Digests are stronger; CI should rewrite `digest:` after each push.
images:
  - name: ghcr.io/atirathi/bheda/backend
    newTag: 1.0.0
  - name: ghcr.io/atirathi/bheda/frontend
    newTag: 1.0.0
  - name: ghcr.io/atirathi/bheda/vuln-app
    newTag: 1.0.0

configMapGenerator:
  - name: global-config
    literals:
      - LOG_LEVEL=INFO
      - ENVIRONMENT=production
      - REGION=us-east-1

# Secrets MUST be generated by the operator or external-secrets controller.
# `secretGenerator` is intentionally omitted here — never commit literals.
# Example (run from CI / deploy step):
#   kubectl -n bheda create secret generic bheda-global-secret \
#     --from-literal=INTERNAL_API_KEY="$(openssl rand -base64 32)"

patches:
  - target:
      kind: Deployment
      name: backend
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: KUBERNETES_CLUSTER
          value: "bheda-prod-eks"
  - target:
      kind: Deployment
      name: vuln-app
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: WAF_ENABLED
          value: "true"

configurations:
  - name: bheda-config
    behavior: merge
    files:
      - config/backend.env
      - config/frontend.env
      - config/vuln-app.env
