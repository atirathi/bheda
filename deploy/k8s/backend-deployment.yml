apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  labels:
    app: bheda
    component: backend
data:
  # URLs should reference the AWS-managed endpoints via Terraform outputs.
  # Secrets are NOT stored in ConfigMap; they live in `backend-secret` below.
  MODE: "practice"
  RABBIT_HOLES_ENABLED: "true"
  SCHEDULER_ENABLED: "true"
  PROFILES_ENABLED: "true"
  # Override with the live CORS allowlist per environment.
  CORS_ORIGINS: "https://bheda.ctf"
  LOG_LEVEL: "INFO"
  DATABASE_URL: "postgresql+asyncpg://bheda@bheda-rds:5432/bheda"
  REDIS_URL: "redis://bheda-redis:6379/0"

---
apiVersion: v1
kind: Secret
metadata:
  name: backend-secret
  labels:
    app: bheda
    component: backend
type: Opaque
# All values MUST be set from a sealed-secrets / external-secrets controller
# or `kubectl create secret` with --from-literal. DO NOT commit real values.
stringData:
  API_KEY: "CHANGE_ME_api_key"
  SECRET_KEY: "CHANGE_ME_jwt_signing_key_min_32_chars"
  POSTGRES_PASSWORD: "CHANGE_ME_postgres_password"
  REDIS_PASSWORD: "CHANGE_ME_redis_password"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    app: bheda
    component: backend
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: bheda
      component: backend
  template:
    metadata:
      labels:
        app: bheda
        component: backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/api/v1/metrics"
    spec:
      terminationGracePeriodSeconds: 60
      # Pin to a specific tag (preferably digest sha256:...) — never :latest.
      # Update with: docker buildx imagetools inspect ghcr.io/atirathi/bheda/backend:1.0.0
      containers:
        - name: backend
          image: ghcr.io/atirathi/bheda/backend:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: backend-secret
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            successThreshold: 1
          startupProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 30
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: tmp
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: backend
  labels:
    app: bheda
    component: backend
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      protocol: TCP
  selector:
    app: bheda
    component: backend

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend-hpa
  labels:
    app: bheda
    component: backend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: backend
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
