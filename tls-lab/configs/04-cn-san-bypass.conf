server {
    listen 44304 ssl;
    ssl_client_certificate /certs/ca/ca.crt;
    ssl_verify_client on;
    ssl_verify_depth 1;
    ssl_protocols TLSv1.2 TLSv1.3;
    location / {
        if ($ssl_client_s_dn !~ "CN=trusted") {
            return 403 "Forbidden";
        }
        return 200 "BHEDA{tls_cn_only_verification}";
    }
}
