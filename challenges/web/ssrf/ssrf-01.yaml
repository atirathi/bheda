id: ssrf-01
title: "Server-Side Request Forgery - Challenge 01"
category: web
difficulty: easy
cvss: 7.5
owasp: A10:2021 – Server-Side Request Forgery
endpoint: /api/ssrf/01
description: "SSRF vulnerability in the image download feature. The application fetches user-supplied URLs with a blocklist that can be bypassed."
hints:
  - "The server fetches URLs you provide. Try accessing internal services."
  - "Use file:// protocol to read local files."
  - "Bypass the blocklist using alternative representations like 127.1 or [::]."
flag: "BHEDA{ssrf_challenge_01}"
flag_location: "/etc/flag or internal metadata endpoint"
solution_summary: "Submit a request to http://169.254.169.254/latest/meta-data/ to read cloud metadata and find the flag."
