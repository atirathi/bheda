version: '3.8'

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-healthcheck-defaults: &healthcheck-defaults
  interval: 10s
  timeout: 5s
  retries: 5
  start_period: 15s

services:
  # ─── Core Infrastructure ───
  postgres:
    image: postgres:16-alpine
    container_name: bheda-postgres
    environment:
      POSTGRES_DB: bheda
      POSTGRES_USER: bheda
      POSTGRES_PASSWORD: bheda_secret_2026
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sh:/docker-entrypoint-initdb.d/init.sh
    ports: ["5432:5432"]
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD-SHELL", "pg_isready -U bheda -d bheda"]
    logging: *default-logging
    networks: [bheda-net]
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: bheda-redis
    command: redis-server --requirepass bheda_redis_2026 --appendonly yes
    volumes:
      - redis_data:/data
    ports: ["6379:6379"]
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
    logging: *default-logging
    networks: [bheda-net]
    restart: unless-stopped

  mongodb:
    image: mongo:7
    container_name: bheda-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: bheda
      MONGO_INITDB_ROOT_PASSWORD: bheda_mongo_2026
      MONGO_INITDB_DATABASE: bheda
    volumes:
      - mongo_data:/data/db
    ports: ["27017:27017"]
    healthcheck:
      <<: *healthcheck-defaults
      test: echo 'db.runCommand("ping").ok' | mongosh --quiet
    logging: *default-logging
    networks: [bheda-net]
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: bheda-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: bheda
      MINIO_ROOT_PASSWORD: bheda_minio_2026
      MINIO_DOMAIN: minio
    volumes:
      - minio_data:/data
    ports: ["9000:9000", "9001:9001"]
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
    logging: *default-logging
    networks: [bheda-net]
    restart: unless-stopped

  # ─── Platform Backend ───
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: bheda-backend
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      DATABASE_URL: postgresql+asyncpg://bheda:bheda_secret_2026@postgres:5432/bheda
      REDIS_URL: redis://:bheda_redis_2026@redis:6379/0
      SECRET_KEY: bheda-jwt-secret-key-2026-super-secure
      API_KEY: bheda-internal-api-key-2026
      MODE: practice
      RABBIT_HOLES_ENABLED: "true"
      SCHEDULER_ENABLED: "true"
      PROFILES_ENABLED: "true"
      CORS_ORIGINS: "*"
    volumes:
      - ./challenges:/app/challenges:ro
    ports: ["8000:8000"]
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
    logging: *default-logging
    networks: [bheda-net]
    restart: unless-stopped

  # ─── Frontend ───
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: bheda-frontend
    depends_on:
      backend: { condition: service_healthy }
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_WS_URL: ws://localhost:8000/api/v1/ws
    ports: ["3000:3000"]
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "wget", "--spider", "http://localhost:3000"]
    logging: *default-logging
    networks: [bheda-net]
    restart: unless-stopped

  # ─── WAF (ModSecurity) ───
  waf:
    build: ./waf
    container_name: bheda-waf
    depends_on:
      vuln-app: { condition: service_started }
    ports: ["80:80"]
    volumes:
      - ./waf/modsecurity.conf:/etc/modsecurity/modsecurity.conf:ro
      - ./waf/bypass-rules:/etc/modsecurity/bypass-rules:ro
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
    logging: *default-logging
    networks: [bheda-net]
    restart: unless-stopped

  # ─── Vulnerable App ───
  vuln-app:
    build:
      context: .
      dockerfile: Dockerfile.vuln-app
    container_name: bheda-vuln-app
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      mongodb: { condition: service_started }
    environment:
      DATABASE_URL: postgresql://bheda:bheda_secret_2026@postgres:5432/bheda
      REDIS_URL: redis://:bheda_redis_2026@redis:6379/0
      MONGO_URL: mongodb://bheda:bheda_mongo_2026@mongodb:27017/bheda
      BACKEND_URL: http://backend:8000
      WAF_ENABLED: "true"
      FLAG_SECRET: bheda_lab_secret_key_2024
    ports: ["3001:3001"]
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
    logging: *default-logging
    networks: [bheda-net]
    restart: unless-stopped

  # ─── Rabbit Holes ───
  rabbit-holes:
    build: ./rabbit-holes
    container_name: bheda-rabbit-holes
    depends_on:
      redis: { condition: service_healthy }
    environment:
      REDIS_URL: redis://:bheda_redis_2026@redis:6379/0
      BACKEND_URL: http://backend:8000
      PORT: "3002"
    ports: ["3002:3002"]
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "curl", "-f", "http://localhost:3002/health"]
    logging: *default-logging
    networks: [bheda-net]
    restart: unless-stopped

  # ─── Zero-Days ───
  zero-days:
    build: ./zero-days
    container_name: bheda-zero-days
    depends_on:
      vuln-app: { condition: service_started }
      backend: { condition: service_healthy }
    environment:
      VULN_APP_URL: http://vuln-app:3001
      BACKEND_URL: http://backend:8000
      REDIS_URL: redis://:bheda_redis_2026@redis:6379/0
      API_KEY: bheda-internal-api-key-2026
      PORT: "3003"
    ports: ["3003:3003"]
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "curl", "-f", "http://localhost:3003/health"]
    logging: *default-logging
    networks: [bheda-net]
    restart: unless-stopped

  # ─── CTF Engine ───
  ctf-engine:
    build: ./ctf-engine
    container_name: bheda-ctf-engine
    depends_on:
      backend: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      BACKEND_URL: http://backend:8000
      REDIS_URL: redis://:bheda_redis_2026@redis:6379/0
      API_KEY: bheda-internal-api-key-2026
      MODE: practice
      PORT: "3004"
    ports: ["3004:3004"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "curl", "-f", "http://localhost:3004/health"]
    logging: *default-logging
    networks: [bheda-net]
    restart: unless-stopped

  # ─── Honeypot Microservices (Rabbit Holes) ───
  honeypot-payment:
    build: ./rabbit-holes
    container_name: bheda-honeypot-payment
    environment:
      HONEYPOT_ROLE: payment
      PORT: "3010"
    ports: ["3010:3010"]
    networks: [bheda-net]
    restart: unless-stopped

  honeypot-user-sync:
    build: ./rabbit-holes
    container_name: bheda-honeypot-user-sync
    environment:
      HONEYPOT_ROLE: user-sync
      PORT: "3011"
    ports: ["3011:3011"]
    networks: [bheda-net]
    restart: unless-stopped

  honeypot-dashboard:
    build: ./rabbit-holes
    container_name: bheda-honeypot-dashboard
    environment:
      HONEYPOT_ROLE: dashboard
      PORT: "3012"
    ports: ["3012:3012"]
    networks: [bheda-net]
    restart: unless-stopped

  honeypot-legacy-api:
    build: ./rabbit-holes
    container_name: bheda-honeypot-legacy-api
    environment:
      HONEYPOT_ROLE: legacy-api
      PORT: "3013"
    ports: ["3013:3013"]
    networks: [bheda-net]
    restart: unless-stopped

  # ─── TLS Lab (16 nginx containers) ───
  tls-01-self-signed:
    image: nginx:1.24-alpine
    container_name: bheda-tls-01
    ports: ["44301:44301"]
    volumes:
      - ./tls-lab/configs/01-self-signed.conf:/etc/nginx/conf.d/default.conf:ro
      - ./tls-lab/certs/self-signed:/certs/self-signed:ro
    networks: [bheda-net]
    restart: unless-stopped

  tls-02-expired:
    image: nginx:1.24-alpine
    container_name: bheda-tls-02
    ports: ["44302:44302"]
    volumes:
      - ./tls-lab/configs/02-expired.conf:/etc/nginx/conf.d/default.conf:ro
      - ./tls-lab/certs/expired:/certs/expired:ro
    networks: [bheda-net]
    restart: unless-stopped

  tls-03-wildcard:
    image: nginx:1.24-alpine
    container_name: bheda-tls-03
    ports: ["44303:44303"]
    volumes:
      - ./tls-lab/configs/03-wildcard.conf:/etc/nginx/conf.d/default.conf:ro
      - ./tls-lab/certs/wildcard:/certs/wildcard:ro
    networks: [bheda-net]
    restart: unless-stopped

  tls-04-cn-san-bypass:
    image: nginx:1.24-alpine
    container_name: bheda-tls-04
    ports: ["44304:44304"]
    volumes:
      - ./tls-lab/configs/04-cn-san-bypass.conf:/etc/nginx/conf.d/default.conf:ro
      - ./tls-lab/certs/ca:/certs/ca:ro
    networks: [bheda-net]
    restart: unless-stopped

  tls-05-crl-disabled:
    image: nginx:1.24-alpine
    container_name: bheda-tls-05
    ports: ["44305:44305"]
    volumes:
      - ./tls-lab/configs/05-crl-disabled.conf:/etc/nginx/conf.d/default.conf:ro
      - ./tls-lab/certs/ca:/certs/ca:ro
      - ./tls-lab/certs/revoked:/certs/revoked:ro
    networks: [bheda-net]
    restart: unless-stopped

  tls-06-rsa512:
    image: nginx:1.24-alpine
    container_name: bheda-tls-06
    ports: ["44306:44306"]
    volumes:
      - ./tls-lab/configs/06-rsa512.conf:/etc/nginx/conf.d/default.conf:ro
      - ./tls-lab/certs/rsa512:/certs/rsa512:ro
    networks: [bheda-net]
    restart: unless-stopped

  tls-07-sslv3:
    image: nginx:1.24-alpine-slim
    container_name: bheda-tls-07
    ports: ["44307:44307"]
    volumes:
      - ./tls-lab/configs/07-sslv3.conf:/etc/nginx/conf.d/default.conf:ro
      - ./tls-lab/certs/self-signed:/certs/self-signed:ro
    networks: [bheda-net]
    restart: unless-stopped

  tls-08-rc4:
    image: nginx:1.24-alpine
    container_name: bheda-tls-08
    ports: ["44308:44308"]
    volumes:
      - ./tls-lab/configs/08-rc4.conf:/etc/nginx/conf.d/default.conf:ro
      - ./tls-lab/certs/self-signed:/certs/self-signed:ro
    networks: [bheda-net]
    restart: unless-stopped

  tls-09-null-cipher:
    image: nginx:1.24-alpine
    container_name: bheda-tls-09
    ports: ["44309:44309"]
    volumes:
      - ./tls-lab/configs/09-null-cipher.conf:/etc/nginx/conf.d/default.conf:ro
      - ./tls-lab/certs/self-signed:/certs/self-signed:ro
    networks: [bheda-net]
    restart: unless-stopped

  tls-10-tls1-0-beast:
    image: nginx:1.24-alpine
    container_name: bheda-tls-10
    ports: ["44310:44310"]
    volumes:
      - ./tls-lab/configs/10-tls1.0-beast.conf:/etc/nginx/conf.d/default.conf:ro
      - ./tls-lab/certs/self-signed:/certs/self-signed:ro
    networks: [bheda-net]
    restart: unless-stopped

  tls-11-export-dh:
    image: nginx:1.24-alpine
    container_name: bheda-tls-11
    ports: ["44311:44311"]
    volumes:
      - ./tls-lab/configs/11-export-dh.conf:/etc/nginx/conf.d/default.conf:ro
      - ./tls-lab/certs/self-signed:/certs/self-signed:ro
    networks: [bheda-net]
    restart: unless-stopped

  tls-12-compression:
    image: nginx:1.24-alpine
    container_name: bheda-tls-12
    ports: ["44312:44312"]
    volumes:
      - ./tls-lab/configs/12-compression.conf:/etc/nginx/conf.d/default.conf:ro
      - ./tls-lab/certs/self-signed:/certs/self-signed:ro
    networks: [bheda-net]
    restart: unless-stopped

  tls-13-heartbleed:
    image: nginx:1.24-alpine
    container_name: bheda-tls-13
    ports: ["44313:44313"]
    volumes:
      - ./tls-lab/configs/13-heartbleed.conf:/etc/nginx/conf.d/default.conf:ro
      - ./tls-lab/certs/self-signed:/certs/self-signed:ro
    networks: [bheda-net]
    restart: unless-stopped

  tls-14-renegotiation:
    image: nginx:1.24-alpine
    container_name: bheda-tls-14
    ports: ["44314:44314"]
    volumes:
      - ./tls-lab/configs/14-renegotiation.conf:/etc/nginx/conf.d/default.conf:ro
      - ./tls-lab/certs/self-signed:/certs/self-signed:ro
    networks: [bheda-net]
    restart: unless-stopped

  tls-15-session-ticket:
    image: nginx:1.24-alpine
    container_name: bheda-tls-15
    ports: ["44315:44315"]
    volumes:
      - ./tls-lab/configs/15-session-ticket.conf:/etc/nginx/conf.d/default.conf:ro
      - ./tls-lab/certs/session:/certs/session:ro
      - ./tls-lab/certs/self-signed:/certs/self-signed:ro
    networks: [bheda-net]
    restart: unless-stopped

  tls-16-breach:
    image: nginx:1.24-alpine
    container_name: bheda-tls-16
    ports: ["44316:44316"]
    volumes:
      - ./tls-lab/configs/16-breach.conf:/etc/nginx/conf.d/default.conf:ro
      - ./tls-lab/certs/self-signed:/certs/self-signed:ro
    networks: [bheda-net]
    restart: unless-stopped

networks:
  bheda-net:
    driver: bridge
    name: bheda_net

volumes:
  postgres_data:
    name: bheda_postgres_data
  redis_data:
    name: bheda_redis_data
  mongo_data:
    name: bheda_mongo_data
  minio_data:
    name: bheda_minio_data
