version: '3.8'

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-healthcheck-defaults: &healthcheck-defaults
  interval: 10s
  timeout: 5s
  retries: 5
  start_period: 15s

# Conservative hardening applied to every service that doesn't need to bind
# privileged ports or write outside its volume. Public-facing services (frontend,
# backend, waf) get the same anchor for defense in depth.
x-hardening: &default-hardening
  security_opt:
    - "no-new-privileges:true"
  cap_drop:
    - ALL
  cap_add: []
  read_only: false
  tmpfs:
    - /tmp:size=64m,mode=1777

# The official postgres/redis/mongo images start as root, then chown their
# data dir and drop to an unprivileged user (gosu/su-exec/setpriv). A blanket
# cap_drop:ALL breaks that on a fresh volume ("operation not permitted"), so
# these images get back only the caps that privilege-drop requires.
x-db-hardening: &db-hardening
  security_opt:
    - "no-new-privileges:true"
  cap_drop:
    - ALL
  cap_add:
    - CHOWN
    - DAC_OVERRIDE
    - FOWNER
    - SETGID
    - SETUID
    - SETPCAP
  read_only: false
  tmpfs:
    - /tmp:size=64m,mode=1777

services:
  # ─── Core Infrastructure ───
  postgres:
    image: postgres:16.4-alpine
    container_name: bheda-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bheda}
      POSTGRES_USER: ${POSTGRES_USER:-bheda}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # initdb.d scripts run once, alphabetically: create the vuln-app's
      # isolated database first, then the platform schema.
      - ./scripts/init-vuln-db.sh:/docker-entrypoint-initdb.d/00-init-vuln-db.sh
      - ./scripts/init-db.sh:/docker-entrypoint-initdb.d/01-init.sh
    # Bind to host loopback — DB is reachable only from the docker network
    # or from the host (e.g., for an operator running psql). Use an SSH tunnel
    # or a reverse proxy if remote access is required.
    ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
    logging: *default-logging
    networks: [bheda-net]
    restart: unless-stopped
    # Postgres needs to write to its data dir; cannot be read-only.
    <<: *db-hardening

  redis:
    image: redis:7.4-alpine
    container_name: bheda-redis
    # The healthcheck authenticates with $REDIS_PASSWORD, so it must exist
    # in the container env — passing it only as a --requirepass arg leaves
    # the healthcheck unauthenticated (WRONGPASS → perpetually unhealthy).
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      - --appendonly
      - "yes"
      - --maxmemory
      - "512mb"
      - --maxmemory-policy
      - "allkeys-lru"
    volumes:
      - redis_data:/data
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "sh", "-c", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
    logging: *default-logging
    networks: [bheda-net]
    restart: unless-stopped
    <<: *db-hardening

  mongodb:
    image: mongo:7.0
    container_name: bheda-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-bheda}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?MONGO_PASSWORD is required}
      MONGO_INITDB_DATABASE: ${POSTGRES_DB:-bheda}
    volumes:
      - mongo_data:/data/db
    ports: ["127.0.0.1:27017:27017"]
    healthcheck:
      <<: *healthcheck-defaults
      test: echo 'db.runCommand("ping").ok' | mongosh --quiet
    logging: *default-logging
    networks: [bheda-net]
    restart: unless-stopped
    <<: *db-hardening

  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    container_name: bheda-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-bheda}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:?MINIO_PASSWORD is required}
      MINIO_DOMAIN: minio
    volumes:
      - minio_data:/data
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
    logging: *default-logging
    networks: [bheda-net]
    restart: unless-stopped
    <<: *default-hardening

  # ─── Platform Backend ───
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: bheda-backend
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      API_KEY: ${API_KEY:?API_KEY is required}
      # Must equal the vuln-app's FLAG_SECRET — flags are derived from it.
      FLAG_SECRET: ${FLAG_SECRET:?FLAG_SECRET is required}
      MODE: ${MODE:-practice}
      RABBIT_HOLES_ENABLED: ${RABBIT_HOLES_ENABLED:-true}
      SCHEDULER_ENABLED: ${SCHEDULER_ENABLED:-true}
      PROFILES_ENABLED: ${PROFILES_ENABLED:-true}
      # CORS_ORIGINS should be a comma-separated allowlist in prod, not "*".
      CORS_ORIGINS: ${CORS_ORIGINS:-https://bheda.ctf}
    volumes:
      - ./challenges:/app/challenges:ro
    # Loopback only — Traefik/WAF handle the public ingress.  Binding
    # to 0.0.0.0 would expose the unauthenticated API to anyone with
    # network access to the host, bypassing the WAF and rate limits.
    ports: ["127.0.0.1:8000:8000"]
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
    logging: *default-logging
    networks: [bheda-net]
    restart: unless-stopped
    <<: *default-hardening

  # ─── Frontend ───
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: bheda-frontend
    depends_on:
      backend: { condition: service_healthy }
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8000/api/v1/ws}
    # Loopback only — Traefik/WAF handle the public ingress.
    ports: ["127.0.0.1:3000:3000"]
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "wget", "--spider", "http://localhost:3000"]
    logging: *default-logging
    networks: [bheda-net]
    restart: unless-stopped
    <<: *default-hardening

  # ─── WAF (ModSecurity) ───
  waf:
    build: ./waf
    container_name: bheda-waf
    depends_on:
      vuln-app: { condition: service_started }
    ports: ["80:80"]
    volumes:
      - ./waf/modsecurity.conf:/etc/modsecurity/modsecurity.conf:ro
      - ./waf/bypass-rules:/etc/modsecurity/bypass-rules:ro
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
    logging: *default-logging
    networks: [bheda-net]
    restart: unless-stopped
    <<: *default-hardening

  # ─── Vulnerable App ───
  vuln-app:
    build:
      context: .
      dockerfile: Dockerfile.vuln-app
    container_name: bheda-vuln-app
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      mongodb: { condition: service_started }
    environment:
      # Secrets are sourced from .env (or a secret store) — never hardcode here.
      # Generate fresh values with: openssl rand -base64 32
      PG_HOST: postgres
      PG_PORT: "5432"
      # Dedicated DB — keeps SQLi challenges away from the platform's real
      # users/teams/submissions in ${POSTGRES_DB}.
      PG_DB: ${VULN_DB:-bheda_vuln}
      PG_USER: ${POSTGRES_USER}
      PG_PASS: ${POSTGRES_PASSWORD}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      MONGO_URI: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongodb:27017/bheda
      BACKEND_URL: http://backend:8000
      WAF_ENABLED: "true"
      FLAG_SECRET: ${FLAG_SECRET:?FLAG_SECRET is required}
      NODE_ENV: production
      # app.ts defaults to PORT 3000; the port mapping and healthcheck
      # below expect 3001, so it MUST be set explicitly or the container
      # listens on the wrong port and every challenge becomes unreachable.
      PORT: "3001"
    ports: ["127.0.0.1:3001:3001"]
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
    logging: *default-logging
    networks: [bheda-net]
    restart: unless-stopped
    # Hardening — vuln-app intentionally runs vulnerable code; minimize blast radius.
    read_only: false   # vuln-app needs /tmp for some challenges; keep off for now
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    # No cap_add — vuln-app binds 3001 (unprivileged), so NET_BIND_SERVICE
    # is unnecessary and only widens the blast radius of intentionally
    # vulnerable code.
    tmpfs:
      - /tmp:size=64m,mode=1777

  # ─── Rabbit Holes ───
  rabbit-holes:
    build: ./rabbit-holes
    container_name: bheda-rabbit-holes
    depends_on:
      redis: { condition: service_healthy }
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      BACKEND_URL: http://backend:8000
      PORT: "3002"
    ports: ["127.0.0.1:3002:3002"]
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "curl", "-f", "http://localhost:3002/health"]
    logging: *default-logging
    networks: [bheda-net]
    restart: unless-stopped
    <<: *default-hardening

  # ─── Zero-Days ───
  zero-days:
    build: ./zero-days
    container_name: bheda-zero-days
    depends_on:
      vuln-app: { condition: service_started }
      backend: { condition: service_healthy }
    environment:
      VULN_APP_URL: http://vuln-app:3001
      BACKEND_URL: http://backend:8000
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      API_KEY: ${API_KEY:?API_KEY is required}
      PORT: "3003"
    ports: ["127.0.0.1:3003:3003"]
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "curl", "-f", "http://localhost:3003/health"]
    logging: *default-logging
    networks: [bheda-net]
    restart: unless-stopped
    <<: *default-hardening

  # ─── CTF Engine ───
  # WARNING: This container has access to the host Docker socket. It MUST
  # be considered a privileged component. Restrict network egress, drop all
  # capabilities, and run as a non-root user. We do NOT add `no-new-privileges`
  # here because docker.sock access requires the docker group, but we do
  # drop capabilities and pin the user.
  ctf-engine:
    build: ./ctf-engine
    container_name: bheda-ctf-engine
    depends_on:
      backend: { condition: service_healthy }
      redis: { condition: service_healthy }
    user: "1000:1000"   # non-root; operator must create this user on the host
    environment:
      BACKEND_URL: http://backend:8000
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      API_KEY: ${API_KEY:?API_KEY is required}
      MODE: ${MODE:-practice}
      PORT: "3004"
    ports: ["127.0.0.1:3004:3004"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "curl", "-f", "http://localhost:3004/health"]
    logging: *default-logging
    networks: [bheda-net]
    restart: unless-stopped
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL

  # ─── Honeypot Microservices (Rabbit Holes) ───
  honeypot-payment:
    build: ./rabbit-holes
    container_name: bheda-honeypot-payment
    environment:
      HONEYPOT_ROLE: payment
      PORT: "3010"
    ports: ["127.0.0.1:3010:3010"]
    networks: [bheda-net]
    restart: unless-stopped
    <<: *default-hardening

  honeypot-user-sync:
    build: ./rabbit-holes
    container_name: bheda-honeypot-user-sync
    environment:
      HONEYPOT_ROLE: user-sync
      PORT: "3011"
    ports: ["127.0.0.1:3011:3011"]
    networks: [bheda-net]
    restart: unless-stopped
    <<: *default-hardening

  honeypot-dashboard:
    build: ./rabbit-holes
    container_name: bheda-honeypot-dashboard
    environment:
      HONEYPOT_ROLE: dashboard
      PORT: "3012"
    ports: ["127.0.0.1:3012:3012"]
    networks: [bheda-net]
    restart: unless-stopped
    <<: *default-hardening

  honeypot-legacy-api:
    build: ./rabbit-holes
    container_name: bheda-honeypot-legacy-api
    environment:
      HONEYPOT_ROLE: legacy-api
      PORT: "3013"
    ports: ["127.0.0.1:3013:3013"]
    networks: [bheda-net]
    restart: unless-stopped
    <<: *default-hardening

  # ─── TLS Lab (16 nginx containers) ───
  tls-01-self-signed:
    image: nginx:1.24-alpine
    container_name: bheda-tls-01
    ports: ["127.0.0.1:44301:44301"]
    volumes:
      - ./tls-lab/configs/01-self-signed.conf:/etc/nginx/conf.d/default.conf:ro
      - ./tls-lab/certs/self-signed:/certs/self-signed:ro
    networks: [bheda-net]
    restart: unless-stopped

    <<: *default-hardening
  tls-02-expired:
    image: nginx:1.24-alpine
    container_name: bheda-tls-02
    ports: ["127.0.0.1:44302:44302"]
    volumes:
      - ./tls-lab/configs/02-expired.conf:/etc/nginx/conf.d/default.conf:ro
      - ./tls-lab/certs/expired:/certs/expired:ro
    networks: [bheda-net]
    restart: unless-stopped

    <<: *default-hardening
  tls-03-wildcard:
    image: nginx:1.24-alpine
    container_name: bheda-tls-03
    ports: ["127.0.0.1:44303:44303"]
    volumes:
      - ./tls-lab/configs/03-wildcard.conf:/etc/nginx/conf.d/default.conf:ro
      - ./tls-lab/certs/wildcard:/certs/wildcard:ro
    networks: [bheda-net]
    restart: unless-stopped

    <<: *default-hardening
  tls-04-cn-san-bypass:
    image: nginx:1.24-alpine
    container_name: bheda-tls-04
    ports: ["127.0.0.1:44304:44304"]
    volumes:
      - ./tls-lab/configs/04-cn-san-bypass.conf:/etc/nginx/conf.d/default.conf:ro
      - ./tls-lab/certs/ca:/certs/ca:ro
    networks: [bheda-net]
    restart: unless-stopped

    <<: *default-hardening
  tls-05-crl-disabled:
    image: nginx:1.24-alpine
    container_name: bheda-tls-05
    ports: ["127.0.0.1:44305:44305"]
    volumes:
      - ./tls-lab/configs/05-crl-disabled.conf:/etc/nginx/conf.d/default.conf:ro
      - ./tls-lab/certs/ca:/certs/ca:ro
      - ./tls-lab/certs/revoked:/certs/revoked:ro
    networks: [bheda-net]
    restart: unless-stopped

    <<: *default-hardening
  tls-06-rsa512:
    image: nginx:1.24-alpine
    container_name: bheda-tls-06
    ports: ["127.0.0.1:44306:44306"]
    volumes:
      - ./tls-lab/configs/06-rsa512.conf:/etc/nginx/conf.d/default.conf:ro
      - ./tls-lab/certs/rsa512:/certs/rsa512:ro
    networks: [bheda-net]
    restart: unless-stopped

    <<: *default-hardening
  tls-07-sslv3:
    image: nginx:1.24-alpine-slim
    container_name: bheda-tls-07
    ports: ["127.0.0.1:44307:44307"]
    volumes:
      - ./tls-lab/configs/07-sslv3.conf:/etc/nginx/conf.d/default.conf:ro
      - ./tls-lab/certs/self-signed:/certs/self-signed:ro
    networks: [bheda-net]
    restart: unless-stopped

    <<: *default-hardening
  tls-08-rc4:
    image: nginx:1.24-alpine
    container_name: bheda-tls-08
    ports: ["127.0.0.1:44308:44308"]
    volumes:
      - ./tls-lab/configs/08-rc4.conf:/etc/nginx/conf.d/default.conf:ro
      - ./tls-lab/certs/self-signed:/certs/self-signed:ro
    networks: [bheda-net]
    restart: unless-stopped

    <<: *default-hardening
  tls-09-null-cipher:
    image: nginx:1.24-alpine
    container_name: bheda-tls-09
    ports: ["127.0.0.1:44309:44309"]
    volumes:
      - ./tls-lab/configs/09-null-cipher.conf:/etc/nginx/conf.d/default.conf:ro
      - ./tls-lab/certs/self-signed:/certs/self-signed:ro
    networks: [bheda-net]
    restart: unless-stopped

    <<: *default-hardening
  tls-10-tls1-0-beast:
    image: nginx:1.24-alpine
    container_name: bheda-tls-10
    ports: ["127.0.0.1:44310:44310"]
    volumes:
      - ./tls-lab/configs/10-tls1.0-beast.conf:/etc/nginx/conf.d/default.conf:ro
      - ./tls-lab/certs/self-signed:/certs/self-signed:ro
    networks: [bheda-net]
    restart: unless-stopped

    <<: *default-hardening
  tls-11-export-dh:
    image: nginx:1.24-alpine
    container_name: bheda-tls-11
    ports: ["127.0.0.1:44311:44311"]
    volumes:
      - ./tls-lab/configs/11-export-dh.conf:/etc/nginx/conf.d/default.conf:ro
      - ./tls-lab/certs/self-signed:/certs/self-signed:ro
    networks: [bheda-net]
    restart: unless-stopped

    <<: *default-hardening
  tls-12-compression:
    image: nginx:1.24-alpine
    container_name: bheda-tls-12
    ports: ["127.0.0.1:44312:44312"]
    volumes:
      - ./tls-lab/configs/12-compression.conf:/etc/nginx/conf.d/default.conf:ro
      - ./tls-lab/certs/self-signed:/certs/self-signed:ro
    networks: [bheda-net]
    restart: unless-stopped

    <<: *default-hardening
  tls-13-heartbleed:
    image: nginx:1.24-alpine
    container_name: bheda-tls-13
    ports: ["127.0.0.1:44313:44313"]
    volumes:
      - ./tls-lab/configs/13-heartbleed.conf:/etc/nginx/conf.d/default.conf:ro
      - ./tls-lab/certs/self-signed:/certs/self-signed:ro
    networks: [bheda-net]
    restart: unless-stopped

    <<: *default-hardening
  tls-14-renegotiation:
    image: nginx:1.24-alpine
    container_name: bheda-tls-14
    ports: ["127.0.0.1:44314:44314"]
    volumes:
      - ./tls-lab/configs/14-renegotiation.conf:/etc/nginx/conf.d/default.conf:ro
      - ./tls-lab/certs/self-signed:/certs/self-signed:ro
    networks: [bheda-net]
    restart: unless-stopped

    <<: *default-hardening
  tls-15-session-ticket:
    image: nginx:1.24-alpine
    container_name: bheda-tls-15
    ports: ["127.0.0.1:44315:44315"]
    volumes:
      - ./tls-lab/configs/15-session-ticket.conf:/etc/nginx/conf.d/default.conf:ro
      - ./tls-lab/certs/session:/certs/session:ro
      - ./tls-lab/certs/self-signed:/certs/self-signed:ro
    networks: [bheda-net]
    restart: unless-stopped

    <<: *default-hardening
  tls-16-breach:
    image: nginx:1.24-alpine
    container_name: bheda-tls-16
    ports: ["127.0.0.1:44316:44316"]
    volumes:
      - ./tls-lab/configs/16-breach.conf:/etc/nginx/conf.d/default.conf:ro
      - ./tls-lab/certs/self-signed:/certs/self-signed:ro
    networks: [bheda-net]
    restart: unless-stopped
    <<: *default-hardening

networks:
  bheda-net:
    driver: bridge
    name: bheda_net

volumes:
  postgres_data:
    name: bheda_postgres_data
  redis_data:
    name: bheda_redis_data
  mongo_data:
    name: bheda_mongo_data
  minio_data:
    name: bheda_minio_data
