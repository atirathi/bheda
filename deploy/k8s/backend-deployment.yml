apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  labels:
    app: bheda
    component: backend
data:
  DATABASE_URL: "postgresql+asyncpg://bheda:bheda_secret_2026@bheda-rds.cluster-xxxxxxx.us-east-1.rds.amazonaws.com:5432/bheda"
  REDIS_URL: "redis://:bheda_redis_2026@bheda-redis.xxxxxx.ng.0001.use1.cache.amazonaws.com:6379/0"
  SECRET_KEY: "bheda-jwt-secret-key-2026-super-secure"
  MODE: "practice"
  RABBIT_HOLES_ENABLED: "true"
  SCHEDULER_ENABLED: "true"
  PROFILES_ENABLED: "true"
  CORS_ORIGINS: "*"
  LOG_LEVEL: "INFO"

---
apiVersion: v1
kind: Secret
metadata:
  name: backend-secret
  labels:
    app: bheda
    component: backend
type: Opaque
stringData:
  API_KEY: "bheda-internal-api-key-2026"
  SECRET_KEY: "bheda-jwt-secret-key-2026-super-secure"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    app: bheda
    component: backend
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: bheda
      component: backend
  template:
    metadata:
      labels:
        app: bheda
        component: backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/api/v1/metrics"
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: backend
          image: ghcr.io/atirathi/bheda/backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: backend-secret
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            successThreshold: 1
          startupProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 30
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: backend
  labels:
    app: bheda
    component: backend
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      protocol: TCP
  selector:
    app: bheda
    component: backend

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend-hpa
  labels:
    app: bheda
    component: backend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: backend
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
