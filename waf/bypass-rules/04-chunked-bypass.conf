# Bypass: Chunked transfer encoding not inspected before reassembly
# CRS inspects reassembled body but chunk boundaries may hide payload fragments
SecRule REQUEST_HEADERS:Transfer-Encoding "@rx \bchunked\b" "id:100400,phase:1,t:none,pass,log,msg:'Chunked encoding - body reassembly may bypass inspection',setvar:tx.anomaly_score=+1"
