id: biz-01
title: "Business Logic Flaw - Challenge 01"
category: web
difficulty: easy
cvss: 5.5
owasp: A01:2021 – Broken Access Control
endpoint: /api/biz/01
description: "Business logic vulnerability: coupon codes can be stacked/reused multiple times."
hints:
  - "Try submitting negative quantities or prices."
  - "Intercept the request and modify the price parameter."
  - "The same coupon code can be applied multiple times."
flag: "BHEDA{biz_logic_01}"
