server {
    listen 44315 ssl;
    ssl_certificate /certs/self-signed/server.crt;
    ssl_certificate_key /certs/self-signed/server.key;
    ssl_protocols TLSv1.2;
    ssl_ciphers HIGH:!aNULL:!eNULL;
    ssl_session_tickets on;
    ssl_session_ticket_key /certs/session/ticket.key;
    location / { return 200 "BHEDA{tls_session_ticket_fixed}"; }
}
