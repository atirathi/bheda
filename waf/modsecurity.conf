SecRuleEngine On
SecRequestBodyAccess On
SecResponseBodyAccess On
SecResponseBodyMimeType text/plain text/html text/xml application/json

# CRS loading
Include /etc/modsecurity/crs/crs-setup.conf
Include /etc/modsecurity/crs/rules/*.conf

# Anomaly scoring
SecDefaultAction "phase:1,log,auditlog,deny,status:403,phase:2,log,auditlog,deny,status:403"
SecAction "id:900000,phase:1,pass,setvar:tx.anomaly_score=0,setvar:tx.sql_injection_score=0,setvar:tx.xss_score=0,setvar:tx.lfi_score=0,setvar:tx.rfi_score=0,setvar:tx.php_injection_score=0,setvar:tx.http_violation_score=0,setvar:tx.session_fixation_score=0,nolog"

# Anomaly thresholds
SecAction "id:900001,phase:1,pass,setvar:tx.inbound_anomaly_score_threshold=5,setvar:tx.outbound_anomaly_score_threshold=4,nolog"
