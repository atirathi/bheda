endpoint: /boss/hydra
description: "A 5-step boss chain requiring concurrent exploitation of 5 API endpoints. Each head must be defeated simultaneously."
hints:
  - "Step 1: Race condition on the coupon endpoint."
  - "Step 2: Timing-based blind SQL injection."
  - "Step 3: Server-side template injection."
  - "Step 4: XXE to read application source."
