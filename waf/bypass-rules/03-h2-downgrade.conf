# Bypass: HTTP/2 to HTTP/1.1 downgrade strips security headers
# CRS rules applied to HTTP/1.1 downgraded request miss H2-specific attack vectors
SecRule REQUEST_HEADERS:Upgrade "@contains h2c" "id:100300,phase:1,pass,log,msg:'H2C upgrade detected - potential downgrade attack',setvar:tx.anomaly_score=+1"
