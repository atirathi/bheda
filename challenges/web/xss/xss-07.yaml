id: xss-07
title: "Cross-Site Scripting - Challenge 07"
category: web
difficulty: medium
cvss: 7.3
owasp: A03:2021 – Injection
endpoint: /api/xss/07
description: "XSS vulnerability in the search bar. Input is reflected into the page with incomplete HTML entity filtering."
hints:
  - "Inject a script tag to test for XSS."
  - "The filter blocks <script> but allows other tags like <img> with onerror."
  - "Use event handlers like onfocus or onmouseover to trigger JavaScript execution."
flag: "BHEDA{xss_challenge_07}"
flag_location: "Document cookie or localStorage after XSS execution"
solution_summary: "Inject <img src=x onerror=alert(document.cookie)> to trigger XSS and steal the session cookie containing the flag."
