id: ac-07
title: "Access Control Bypass - Challenge 07"
category: web
difficulty: medium
cvss: 7.8
owasp: A01:2021 – Broken Access Control
endpoint: /api/ac/07
description: "An authorization bypass vulnerability where IDOR allows accessing other users data by changing a numeric parameter."
hints:
  - "Manipulate the role or permission parameter in the request."
  - "Try accessing /admin or /api/admin directly."
  - "Change the user_id parameter to access other accounts."
flag: "BHEDA{access_control_bypass_07}"
flag_location: "/admin endpoint or other user's profile page"
solution_summary: "Modify the GET /api/user?id=1 to id=2 to access the admin user's profile which contains the flag."
